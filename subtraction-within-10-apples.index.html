<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ひきざんりんごとあおむし</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background-color: #fffdf0;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif; touch-action: manipulation; user-select: none;
        }

        .formula-container {
            display: flex; align-items: center; gap: 15px; margin-bottom: 80px;
            font-size: 50px; font-weight: bold; color: #5d4037;
        }

        .input-box {
            width: 90px; height: 90px; border: 4px solid #5d4037; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; background-color: white; cursor: pointer;
        }

        .input-box.num1 { color: #ff5e57; border-color: #ff5e57; }
        .input-box.num2 { color: #4b6584; border-color: #4b6584; }
        .input-box.ans  { background-color: #ffda79; border-color: #cc8e35; }

        .stage-wrapper { position: relative; padding: 40px 20px; }

        .container {
            display: flex; gap: 10px; padding: 30px; background: white;
            border-radius: 25px; border: 4px dashed #d1ccc0; position: relative; z-index: 2;
        }

        .block-unit { display: flex; flex-direction: column; align-items: center; width: 70px; position: relative; }

        .caterpillar {
            position: absolute; top: -10px; font-size: 30px; z-index: 3;
            display: none; transform: rotate(-10deg);
        }

        .block {
            width: 65px; height: 65px; border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            position: relative;
        }

        .is-active { background-color: #fff2f2; border-radius: 12px; border-color: #ff7675; }
        
        /* ゴースト表示（りんごが消えた枠） */
        .is-ghost { border: 2px dashed #ddd; border-radius: 12px; background-color: transparent; }
        .is-ghost::after { content: '🍎'; opacity: 0.15; filter: grayscale(100%); }

        /* 引いた数を囲む枠 */
        #sub-group-frame {
            position: absolute; display: none; border: 3px solid #74b9ff;
            background-color: rgba(116, 185, 255, 0.1); border-radius: 20px; z-index: 1;
        }

        #sub-total-label {
            position: absolute; top: -45px; width: 100%; text-align: center;
            color: #0984e3; font-size: 30px; font-weight: bold; display: none;
        }

        .controls { margin-top: 60px; }
        .reset-btn {
            padding: 18px 50px; font-size: 22px; background-color: #5d4037; color: white;
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="formula-container">
        <div class="input-box num1" id="box1" onclick="confirmNum(1)"></div>
        <span>－</span>
        <div class="input-box num2" id="box2" onclick="confirmNum(2)"></div>
        <span>＝</span>
        <div class="input-box ans" id="boxAns" onclick="showAns()"></div>
    </div>

    <div class="stage-wrapper">
        <div id="sub-group-frame">
            <div id="sub-total-label"></div>
        </div>
        <div class="container" id="stage"></div>
    </div>

    <div class="controls">
        <button class="reset-btn" onclick="resetGame()">はじめから</button>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const box1 = document.getElementById('box1');
        const box2 = document.getElementById('box2');
        const boxAns = document.getElementById('boxAns');
        const subFrame = document.getElementById('sub-group-frame');
        const subLabel = document.getElementById('sub-total-label');

        let mode = 'set'; 
        let totalCount = 0;
        let subCount = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            if (type === 'pop') {
                createOsc(659, 0.15, 'sine', now).frequency.exponentialRampToValueAtTime(880, now + 0.1);
            } else if (type === 'eat') { // 食べる音（サクッ）
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.1, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                noise.connect(g).connect(audioCtx.destination);
                noise.start();
            } else if (type === 'confirm') {
                createOsc(1200, 0.05, 'square', now, 0.05);
            }
        }

        function createOsc(freq, duration, type, startTime, vol = 0.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(vol, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(startTime); osc.stop(startTime + duration);
            return osc;
        }

        function init() {
            stage.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const unit = document.createElement('div');
                unit.className = 'block-unit';
                unit.innerHTML = `
                    <div class="caterpillar" id="C${i}">🐛</div>
                    <div class="block" id="R${i}" onclick="tapBlock(${i})"></div>
                `;
                stage.appendChild(unit);
            }
            subFrame.style.display = 'none';
            subLabel.style.display = 'none';
        }

        function tapBlock(idx) {
            if (mode === 'locked') return;
            if (mode === 'set') {
                if (idx === totalCount + 1) {
                    totalCount++;
                    const b = document.getElementById('R'+idx);
                    b.classList.add('is-active');
                    b.innerText = '🍎';
                    playSound('pop');
                }
            } else if (mode === 'sub') {
                let targetIdx = totalCount - subCount;
                if (idx === targetIdx && subCount < totalCount) {
                    subCount++;
                    const b = document.getElementById('R'+idx);
                    const c = document.getElementById('C'+idx);
                    b.classList.remove('is-active');
                    b.classList.add('is-ghost');
                    b.innerText = '';
                    c.style.display = 'block'; // 青虫登場
                    playSound('eat');
                }
            }
        }

        function confirmNum(num) {
            if (num === 1 && totalCount > 0 && mode === 'set') {
                box1.innerText = totalCount;
                mode = 'sub';
                playSound('confirm');
            } else if (num === 2 && subCount > 0 && mode === 'sub') {
                box2.innerText = subCount;
                mode = 'locked';
                playSound('confirm');
                drawSubFrame();
            }
        }

        function drawSubFrame() {
            const firstSubIdx = totalCount - subCount + 1;
            const lastSubIdx = totalCount;
            const firstBlock = document.getElementById('R' + firstSubIdx);
            const lastBlock = document.getElementById('R' + lastSubIdx);
            const stageRect = stage.getBoundingClientRect();
            const firstRect = firstBlock.getBoundingClientRect();
            const lastRect = lastBlock.getBoundingClientRect();

            subFrame.style.display = 'block';
            subFrame.style.left = (firstRect.left - stageRect.left + 15) + 'px';
            subFrame.style.top = (firstRect.top - stageRect.top + 15) + 'px';
            subFrame.style.width = (lastRect.right - firstRect.left + 10) + 'px';
            subFrame.style.height = (firstRect.height + 10) + 'px';

            subLabel.innerText = subCount;
            subLabel.style.display = 'block';
        }

        function showAns() {
            if (mode === 'locked') {
                boxAns.innerText = totalCount - subCount;
                playSound('confirm');
            }
        }

        function resetGame() {
            totalCount = 0; subCount = 0; mode = 'set';
            box1.innerText = ''; box2.innerText = ''; boxAns.innerText = '';
            init();
        }

        init();
    </script>
</body>
</html>
